<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Imprimir</title>
<style>
  :root {
    --bg: #1e1f22;
    --bg-elevated: #2b2d31;
    --text: #e3e3e3;
    --text-muted: #9a9a9a;
    --accent: #4c8bf5;
    --border: #3a3c40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 0 0 16px 0;
  }
  legend { padding: 0 6px; color: var(--text-muted); }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row:last-child { margin-bottom: 0; }
  .row label {
    width: 90px;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .row .value { color: var(--text); }
  select, input[type="text"] {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
  }
  button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>
  <fieldset>
    <legend>Impressora</legend>
    <div class="row">
      <label>Nome:</label>
      <select id="printer-name">
        <option>Salvar em PDF</option>
      </select>
    </div>
    <div class="row">
      <label>Local:</label>
      <span class="value">Arquivo local</span>
    </div>
    <div class="row">
      <label>Tipo:</label>
      <span class="value">Documento PDF</span>
    </div>
    <div class="row">
      <label>Arquivo:</label>
      <input id="output-path" type="text" />
      <button id="browse-btn">…</button>
    </div>
  </fieldset>
  <div class="actions">
    <button id="cancel-btn">Cancelar</button>
    <button id="print-btn" class="primary">Imprimir</button>
  </div>
  <script src="print-renderer.js"></script>
</body>
</html>
