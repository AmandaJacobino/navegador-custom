<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<style>
  :root {
    --bg-elevated: #2b2d31;
    --text: #e3e3e3;
    --border: #3a3c40;
    --accent: #4c8bf5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 4px;
    background: var(--bg-elevated);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }
  button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover, button:focus-visible { background: rgba(255, 255, 255, 0.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Mesma entrada do dropdown da estrela (ver bookmark-menu.html): a view é
     reaproveitada, então a animação é reiniciada trocando a classe. */
  @keyframes app-menu-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  body.entering { animation: app-menu-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @media (prefers-reduced-motion: reduce) {
    body.entering { animation: none; }
  }
</style>
</head>
<body>
  <button type="button" id="menu-memory">Consumo de memória</button>
  <script src="./app-menu-renderer.js"></script>
</body>
</html>
