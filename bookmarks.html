<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Favoritos</title>
<style>
  :root {
    --bg: #1e1f22;
    --bg-elevated: #2b2d31;
    --text: #e3e3e3;
    --text-muted: #9a9a9a;
    --accent: #4c8bf5;
    --border: #3a3c40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 18px;
    padding: 16px 20px 0 20px;
    margin: 0;
  }
  #list {
    list-style: none;
    margin: 0;
    padding: 12px 20px 0 20px;
  }
  #list li {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #list li:hover { background: rgba(255,255,255,0.05); }
  #list .entry-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #list .entry-url {
    color: var(--text-muted);
    font-size: 12px;
    flex-shrink: 0;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #list .entry-delete {
    color: var(--text-muted);
    flex-shrink: 0;
    padding: 0 4px;
  }
  #list .entry-delete:hover { color: var(--text); }
  #empty {
    padding: 40px 20px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Favoritos</h1>
  <ul id="list"></ul>
  <div id="empty" hidden>Nenhum favorito salvo ainda.</div>
  <script src="bookmarks-renderer.js"></script>
</body>
</html>
