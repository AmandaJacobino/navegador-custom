<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Histórico</title>
<style>
  :root {
    --bg: #1e1f22;
    --bg-elevated: #2b2d31;
    --text: #e3e3e3;
    --text-muted: #9a9a9a;
    --accent: #4c8bf5;
    --border: #3a3c40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 18px;
    padding: 16px 20px 0 20px;
    margin: 0;
  }
  #filters {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
  }
  #filters button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  #filters button:hover { color: var(--text); }
  #filters button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  #clear-all {
    margin-left: auto;
  }
  #list {
    list-style: none;
    margin: 0;
    padding: 0 20px;
  }
  #list li {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #list li:hover { background: rgba(255,255,255,0.05); }
  #list .entry-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #list .entry-time {
    color: var(--text-muted);
    font-size: 12px;
    flex-shrink: 0;
  }
  #list .entry-delete {
    color: var(--text-muted);
    flex-shrink: 0;
    padding: 0 4px;
  }
  #list .entry-delete:hover { color: var(--text); }
  #empty {
    padding: 40px 20px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Histórico</h1>
  <div id="filters">
    <button data-range="today" class="active">Hoje</button>
    <button data-range="yesterday">Ontem</button>
    <button data-range="7days">Últimos 7 dias</button>
    <button data-range="30days">Últimos 30 dias</button>
    <button data-range="all">Tudo</button>
    <button id="clear-all">Limpar tudo</button>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden>Nenhum item no período selecionado.</div>
  <script src="history-renderer.js"></script>
</body>
</html>
