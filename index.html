<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meu Navegador</title>
<style>
  :root {
    --bg: #1e1f22;
    --bg-elevated: #2b2d31;
    --text: #e3e3e3;
    --text-muted: #9a9a9a;
    --accent: #4c8bf5;
    --border: #3a3c40;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-app-region: drag; /* permite arrastar a janela pela UI */
    user-select: none;
  }

  #tabbar {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 6px 8px 0 8px;
    gap: 4px;
    overflow-x: auto;
  }

  .tab {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 180px;
    min-width: 100px;
    padding: 6px 10px;
    border-radius: 8px 8px 0 0;
    background: var(--bg);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab.active {
    background: var(--bg-elevated);
    color: var(--text);
  }

  .tab .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab .close {
    opacity: 0.6;
    padding: 0 2px;
  }
  .tab .close:hover { opacity: 1; }

  #new-tab-btn {
    -webkit-app-region: no-drag;
    color: var(--text-muted);
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 10px;
  }
  #new-tab-btn:hover { color: var(--text); }

  #toolbar {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 10px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  #toolbar button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  #toolbar button:disabled { opacity: 0.3; cursor: default; }
  #toolbar button:disabled:hover { background: none; }

  #address {
    flex: 1;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 0 12px;
    font-size: 13px;
    outline: none;
  }
  #address:focus { border-color: var(--accent); }
</style>
</head>
<body>

  <div id="tabbar">
    <!-- abas inseridas dinamicamente via renderer.js -->
    <button id="new-tab-btn" title="Nova aba">+</button>
  </div>

  <div id="toolbar">
    <button id="btn-back" title="Voltar">←</button>
    <button id="btn-forward" title="Avançar">→</button>
    <button id="btn-reload" title="Recarregar">⟳</button>
    <input id="address" type="text" placeholder="Buscar ou digitar um endereço" />
  </div>

  <script src="renderer.js"></script>
</body>
</html>
